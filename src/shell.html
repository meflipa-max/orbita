<title>Orbita</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Syne:wght@700;800&display=swap">
<style>
/* ============================================================
   ORBITA — arcade siderale. Tema unico e deliberato.
   ============================================================ */
:root{
  --void:#070613; --deep:#0c0a1e; --panel:#141030; --raised:#1d1740;
  --line:rgba(158,138,255,.20); --line-hot:rgba(158,138,255,.42);
  --txt:#ece8ff; --dim:#9c93c6; --faint:#6a6199;
  --hp:#ff3d6e; --xp:#6ff2c4; --gold:#ffc857; --star:#bff6ff;
  --fuoco:#ff6a2b; --gelo:#45d7ff; --fulmine:#ffe14f; --vuoto:#b06bff; --luce:#ffe9b0; --iride:#ff7de3;
  --disp:"Syne","Trebuchet MS",system-ui,sans-serif;
  --ui:"Chakra Petch","Segoe UI",system-ui,-apple-system,sans-serif;
  --cut:10px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--void)}
body{
  font-family:var(--ui); color:var(--txt);
  background:
    radial-gradient(120% 80% at 15% 0%,#1a0f36 0%,rgba(0,0,0,0) 55%),
    radial-gradient(100% 70% at 90% 100%,#0b2338 0%,rgba(0,0,0,0) 60%),
    var(--void);
  overscroll-behavior:none; user-select:none; -webkit-user-select:none;
  font-variant-numeric:tabular-nums;
}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block}

/* atmosfera */
#vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 50%,rgba(0,0,0,0) 42%,rgba(3,2,10,.72) 100%);
  mix-blend-mode:multiply}
#scan{position:absolute;inset:0;pointer-events:none;opacity:.055;
  background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
#flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:#ff3d6e;mix-blend-mode:screen;transition:opacity .18s ease-out}

/* ---------- chrome tagliato ---------- */
.clip{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.frame{background:linear-gradient(150deg,var(--line-hot),rgba(120,100,220,.10) 45%,var(--line-hot));padding:1px}
.frame>.inner{background:linear-gradient(170deg,var(--panel),var(--deep));}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;display:none;flex-direction:column}
#hud.on{display:flex}
#xpline{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(111,242,196,.10)}
#xpfill{height:100%;width:0%;background:linear-gradient(90deg,#38d8a4,var(--xp));box-shadow:0 0 12px rgba(111,242,196,.75);transition:width .12s linear}
/* La prima scheggia raccolta in assoluto: la barra si ingrossa e pulsa per
   un secondo e mezzo. Serve a chiudere il nesso — hai toccato quel puntino
   verde, si e' mosso QUESTO — che a parole richiederebbe una schermata. */
#xpline.primo{height:6px;background:rgba(111,242,196,.22);animation:xpPrimo 1.6s ease-out}
@keyframes xpPrimo{0%,100%{box-shadow:none}
  20%,60%{box-shadow:0 0 26px rgba(111,242,196,.9)}}
#topbar{display:flex;align-items:flex-start;gap:10px;padding:calc(10px + var(--sat)) 12px 0;pointer-events:none}
.hudL{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.hudR{display:flex;align-items:center;gap:8px}

.lvchip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--ui);letter-spacing:.14em;
  color:var(--xp);background:rgba(111,242,196,.09);border:1px solid rgba(111,242,196,.35);
  padding:5px 9px;--cut:6px}
.lvchip b{font:700 14px/1 var(--disp);color:#fff}

#hpwrap{width:min(46vw,290px)}
#hpbar{position:relative;height:16px;background:rgba(255,61,110,.10);border:1px solid rgba(255,61,110,.32);--cut:5px;overflow:hidden}
#hpfill{position:absolute;inset:0;width:100%;transform-origin:left;background:linear-gradient(90deg,#ff2d5f,#ff7aa2);box-shadow:0 0 14px rgba(255,61,110,.6);transition:transform .14s ease-out}
#hpghost{position:absolute;inset:0;width:100%;transform-origin:left;background:rgba(255,255,255,.35);transition:transform .5s .18s ease-out}
#hpbar::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 21px,rgba(7,6,19,.85) 21px 23px)}
#hptxt{position:absolute;inset:0;display:grid;place-items:center;font:600 10px/1 var(--ui);letter-spacing:.1em;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);z-index:2}

#clock{font:800 26px/1 var(--disp);letter-spacing:.02em;color:#fff;text-shadow:0 0 22px rgba(120,180,255,.35)}
#kills{font:500 11px/1 var(--ui);letter-spacing:.16em;color:var(--faint);text-align:right;margin-top:4px}
/* conto alla rovescia del prossimo guardiano: l'attesa dev'essere leggibile */
#nextboss{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:6px;
  font:600 9.5px/1 var(--ui);letter-spacing:.16em;color:#ff8a5c;opacity:0;transition:opacity .3s}
#nextboss.on{opacity:1}
#nextboss i{width:5px;height:5px;background:currentColor;display:block;transform:rotate(45deg)}
#nextboss.soon{color:#ff3d6e;animation:bosspulse 1s ease-in-out infinite}
@keyframes bosspulse{0%,100%{opacity:1}50%{opacity:.4}}
.hudRcol{display:flex;flex-direction:column;align-items:flex-end}
#shard{display:flex;align-items:center;gap:5px;font:600 13px/1 var(--ui);color:var(--gold)}
#shard svg{width:13px;height:13px}

/* l'unico bottone sempre a schermo mentre giochi: 38px erano sotto la
   soglia del pollice, e si preme in corsa mentre si schiva */
.iconbtn{pointer-events:auto;width:46px;height:46px;display:grid;place-items:center;cursor:pointer;
  background:rgba(20,16,48,.72);border:1px solid var(--line);color:var(--dim);--cut:8px;
  backdrop-filter:blur(6px);transition:color .15s,border-color .15s,background .15s}
.iconbtn:hover,.iconbtn:focus-visible{color:#fff;border-color:var(--line-hot);background:rgba(40,32,86,.8)}
.iconbtn svg{width:19px;height:19px}

/* risvegli attivi */
#awake{position:absolute;left:12px;bottom:calc(12px + var(--sab));display:flex;gap:6px;flex-wrap:wrap;max-width:60vw}
.awchip{display:flex;align-items:center;gap:5px;padding:4px 7px;--cut:5px;
  font:600 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;
  background:rgba(12,10,30,.78);border:1px solid currentColor;backdrop-filter:blur(4px);
  animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
.awchip .pips{display:flex;gap:2px}
.awchip i{width:4px;height:4px;background:currentColor;display:block}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

/* istruzioni d'avvio: spariscono al primo movimento */
/* Al 63% dell'altezza, su un telefono, questo pannello finisce esattamente
   dove sta la mano che regge la levetta: il giocatore non lo vede perché ce
   l'ha sotto il pollice. Su puntatore grossolano sale al 38%, sopra la zona
   di presa; col mouse resta dov'era, che li' non copre niente. */
#movehint{position:absolute;left:50%;top:63%;transform:translateX(-50%);display:none;
  flex-direction:column;align-items:center;gap:9px;text-align:center;padding:15px 22px;--cut:9px;
  background:rgba(8,6,22,.74);border:1px solid var(--line);backdrop-filter:blur(6px);
  opacity:0;transition:opacity .45s ease;min-width:min(72vw,236px);max-width:min(86vw,320px)}
#movehint.on{display:flex;opacity:1}
#movehint.out{opacity:0}
#movehint b{font:700 15px/1.25 var(--disp);color:#fff;text-wrap:balance}
#movehint small{font:500 9.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
#movehint .joyd{position:relative;width:46px;height:46px;border-radius:50%;border:1.5px solid rgba(191,246,255,.32);
  background:radial-gradient(circle,rgba(191,246,255,.06),transparent 70%)}
#movehint .joyd i{position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff,var(--star) 55%);box-shadow:0 0 14px rgba(120,220,255,.6);
  animation:joyd 2.6s ease-in-out infinite}
@keyframes joyd{0%,100%{transform:translate(0,0)}25%{transform:translate(11px,-8px)}
  50%{transform:translate(-5px,12px)}75%{transform:translate(-12px,-3px)}}
@media (pointer:coarse){ #movehint{top:38%} }
#movehint .keys{display:flex;gap:4px}
#movehint .keys i{width:25px;height:25px;display:grid;place-items:center;font:600 11px/1 var(--ui);font-style:normal;
  color:var(--dim);border:1px solid var(--line);background:rgba(255,255,255,.05);--cut:5px}

/* joystick */
/* Ingombro ridotto, e dopo un secondo e mezzo la levetta sbiadisce:
   serve come conferma quando appoggi il dito, non per tutta la partita. */
#joy{position:absolute;width:100px;height:100px;margin:-50px 0 0 -50px;pointer-events:none;display:none;z-index:5}
#joy.on{display:block;animation:joyCalma .7s ease-out 1.5s forwards}
@keyframes joyCalma{to{opacity:.38}}
#joy .ring{position:absolute;inset:0;border:1.5px solid rgba(191,246,255,.26);border-radius:50%;
  background:radial-gradient(circle,rgba(191,246,255,.055),rgba(191,246,255,0) 70%)}
#joy .nub{position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fff,var(--star) 45%,rgba(69,215,255,.35) 100%);
  box-shadow:0 0 16px rgba(120,220,255,.45);transition:box-shadow .12s}
/* Fondo corsa. Oltre questo punto spingere non fa andare piu' veloce, e
   senza un segnale il giocatore continua a spingere: il dito gli cammina
   fino in mezzo allo schermo, sopra all'azione. L'!important serve a
   battere l'animazione che sbiadisce la levetta dopo un secondo e mezzo. */
#joy.max{opacity:.95!important}
#joy.max .ring{border-color:rgba(191,246,255,.85);border-width:2px;
  background:radial-gradient(circle,rgba(191,246,255,.12),rgba(191,246,255,0) 72%);
  box-shadow:0 0 22px rgba(120,220,255,.4),inset 0 0 16px rgba(120,220,255,.22)}
#joy.max .nub{box-shadow:0 0 26px rgba(180,240,255,.85)}

/* ---------- schermate ---------- */
#screens{position:absolute;inset:0;z-index:20;pointer-events:none}
.screen{position:absolute;inset:0;display:none;pointer-events:auto;touch-action:pan-y;
  background:radial-gradient(85% 65% at 50% 42%,rgba(10,7,28,.66),rgba(4,3,12,.93));
  backdrop-filter:blur(7px);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(20px + var(--sat)) 16px calc(24px + var(--sab));}
/* "safe center": centrato finche ci sta, ma quando il contenuto supera
   l altezza deve ancorarsi in alto, altrimenti la parte iniziale finisce
   fuori dal riquadro e non e raggiungibile scorrendo. */
.screen.on{display:flex;flex-direction:column;align-items:center;justify-content:safe center;gap:20px;
  animation:fadein .22s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* Ridisegnare la stessa schermata non deve rifare la dissolvenza: ogni
   acquisto nell Osservatorio faceva lampeggiare tutta la pagina. */
.screen.on.ferma{animation:none}
.screen>*{width:100%;max-width:760px}

/* ---------- titolo: il gioco gira dietro, il velo tiene leggibile il testo ---------- */
/* La finestra sul gioco. Questa sfumatura era tarata sul vecchio titolo —
   testo in alto, vetrina in basso — quindi era quasi nera in cima (.86–.95)
   e limpida al 58–74%: da quando l'azione sta in fondo, il buco limpido
   cadeva esattamente dietro ai pannelli e il nero cadeva sul nucleo.
   Adesso è il contrario: limpida dove gira il gioco (30–50%), densa dove
   c'è da leggere — sotto ai pannelli e dietro al logo. */
.screen[data-s="title"]{
  background:linear-gradient(180deg,rgba(5,3,16,.9) 0%,rgba(5,3,16,.62) 18%,
    rgba(5,3,16,.14) 34%,rgba(5,3,16,.14) 50%,rgba(5,3,16,.55) 62%,
    rgba(5,3,16,.86) 74%,rgba(5,3,16,.92) 100%);
  backdrop-filter:blur(1.5px)}
.screen[data-s="title"].on{justify-content:flex-start}
.hero{display:flex;flex-direction:column;align-items:center;gap:15px;width:100%;max-width:760px;
  padding-top:clamp(8px,4vh,54px)}
.hero>*{animation:riseIn .85s cubic-bezier(.2,1,.3,1) backwards}
.hero>*:nth-child(1){animation-delay:.06s}
.hero>*:nth-child(3){animation-delay:.44s}
.hero>*:nth-child(4){animation-delay:.58s}
.hero>*:nth-child(5){animation-delay:.70s}
.hero>*:nth-child(6){animation-delay:.86s}
@keyframes riseIn{from{opacity:0;transform:translateY(20px);filter:blur(7px)}}
.hero .sub em{color:#ece8ff;font-style:normal;font-weight:600}
.hero .elrow{gap:6px}
.hero .el{animation:riseIn .7s cubic-bezier(.2,1,.3,1) backwards}
.hero .cta{display:flex;flex-direction:column;gap:11px;width:100%;max-width:360px}
.hero .hint{margin-top:2px}

h1.logo{animation:logoIn 1s cubic-bezier(.16,1,.3,1) backwards .12s,shimmer 9s linear infinite 1.1s}
@keyframes logoIn{from{opacity:0;transform:scale(.82);filter:blur(22px)}}
@keyframes shimmer{to{background-position:-200% 0}}

.eyebrow{font:600 11px/1 var(--ui);letter-spacing:.34em;text-transform:uppercase;color:var(--faint);text-align:center}
h1.logo{font:800 clamp(48px,15vw,104px)/0.86 var(--disp);letter-spacing:-.03em;margin:0;text-align:center;
  background:linear-gradient(100deg,#ffffff 0%,#bfe4ff 16%,#7a5bff 32%,#ffffff 46%,#7a5bff 60%,#bfe4ff 80%,#ffffff 100%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 40px rgba(122,91,255,.55))}
h2.ttl{font:800 clamp(24px,6vw,34px)/1 var(--disp);letter-spacing:-.015em;margin:0;text-align:center;text-wrap:balance}
.sub{font:400 14px/1.6 var(--ui);color:var(--dim);text-align:center;max-width:60ch;margin:0 auto;text-wrap:balance}

/* Il riquadro dipinto e' .face. Era una span INLINE: la larghezza 100% del
   bottone non la toccava (Gioca era largo 106px su 390, quanto la sua
   scritta) e in altezza il layout ne riservava 19px mentre ne dipingeva 48,
   quindi i bottoni si accavallavano fra loro. Adesso .face e' un blocco
   flex: quello che si vede e' quello che si tocca, e le altezze minime
   tengono ogni bersaglio sopra i 48px consigliati sul telefono. */
.btn{pointer-events:auto;display:flex;width:100%;cursor:pointer;border:0;padding:0;background:none;font:inherit;
  --cut:11px;transition:transform .12s cubic-bezier(.2,1.4,.4,1),filter .15s}
/* flex:1 sulla faccia: affiancato a un bottone piu' alto si allunga invece
   di lasciare un vuoto sotto */
.btn .face{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
  min-height:52px;padding:14px 18px;text-align:center;font:600 14px/1.15 var(--ui);letter-spacing:.18em;text-transform:uppercase;
  background:linear-gradient(165deg,var(--raised),var(--panel));border:1px solid var(--line);color:var(--txt)}
.btn:hover{transform:translateY(-2px)}
.btn:hover .face,.btn:focus-visible .face{border-color:var(--line-hot);color:#fff;background:linear-gradient(165deg,#2a2159,#171240)}
.btn:active{transform:translateY(1px) scale(.99)}
.btn:disabled{opacity:.38;cursor:not-allowed;transform:none}
/* l'azione principale si vede da lontano e si prende col pollice senza mirare */
.btn.primary{--cut:13px}
.btn.primary .face{min-height:62px;font-size:16px;letter-spacing:.22em;
  background:linear-gradient(165deg,#3a2a7d,#1c1450);border-color:rgba(191,246,255,.5);color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 0 30px rgba(90,70,220,.35)}
.btn.primary:hover .face{box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 46px rgba(120,100,255,.55)}
/* su 320px "OSSERVATORIO" a .18em non ci sta in mezza riga e sbordava dal
   suo riquadro: la spaziatura larga resta all'azione principale */
.btn.ghost .face{min-height:48px;background:transparent;border-color:var(--line);color:var(--dim);
  font-size:12px;letter-spacing:.1em;padding:12px 10px}
.btn.ghost:hover .face{color:var(--txt)}
/* dieci pixel fra due bersagli adiacenti sono il minimo per non sbagliare
   bottone col pollice */
.btnrow{display:flex;gap:10px;width:100%}
.btnrow .btn{flex:1;min-width:0}

:focus-visible{outline:2px solid var(--star);outline-offset:3px}

/* ---------- carte upgrade ---------- */
#cards{display:grid;gap:10px;grid-template-columns:1fr;width:100%}
@media(min-width:820px){#cards{grid-template-columns:repeat(3,1fr)}}
.card{pointer-events:auto;cursor:pointer;text-align:left;border:0;padding:0;background:none;font:inherit;
  --cut:12px;--c:var(--dim);transition:transform .13s cubic-bezier(.2,1.4,.4,1)}
.card .face{position:relative;overflow:hidden;display:flex;gap:12px;align-items:flex-start;padding:14px;
  background:linear-gradient(160deg,rgba(30,24,70,.95),rgba(12,10,30,.95));
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);height:100%}
@media(min-width:820px){.card .face{flex-direction:column;min-height:190px}}
.card .face::before{content:"";position:absolute;inset:-40% -10% auto;height:90%;
  background:radial-gradient(60% 100% at 50% 0%,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%);pointer-events:none}
.card:hover{transform:translateY(-4px)}
.card:hover .face,.card:focus-visible .face{border-color:var(--c);box-shadow:0 0 34px -6px color-mix(in srgb,var(--c) 55%,transparent)}
.card .ico{flex:0 0 auto;width:46px;height:46px;display:grid;place-items:center;position:relative;
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);background:color-mix(in srgb,var(--c) 12%,transparent);--cut:8px}
.card .ico svg{width:26px;height:26px;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 6px color-mix(in srgb,var(--c) 70%,transparent))}
.card .body{min-width:0;position:relative}
.card .kicker{font:600 9px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--c);opacity:.95}
.card h3{font:700 17px/1.15 var(--disp);margin:5px 0 6px;color:#fff;letter-spacing:-.01em}
.card p{font:400 12.5px/1.5 var(--ui);margin:0;color:var(--dim)}
.card p em{color:var(--txt);font-style:normal;font-weight:600}
.pips{display:flex;gap:3px;margin-top:8px}
.pips i{width:12px;height:3px;background:color-mix(in srgb,var(--c) 22%,transparent);display:block}
.pips i.f{background:var(--c);box-shadow:0 0 7px color-mix(in srgb,var(--c) 80%,transparent)}
.newtag{position:absolute;top:0;right:0;font:600 9px/1 var(--ui);letter-spacing:.18em;padding:4px 6px;
  background:var(--c);color:#0a0818}
/* la trasformazione è il momento più raro della partita: si vede */
.card.evo .face{border-color:var(--c);border-width:2px;
  box-shadow:0 0 40px -8px color-mix(in srgb,var(--c) 70%,transparent);
  animation:evoPulse 1.7s ease-in-out infinite}
.card.evo .ico{background:color-mix(in srgb,var(--c) 26%,transparent)}
.card.evo h3{color:var(--c)}
@keyframes evoPulse{0%,100%{box-shadow:0 0 34px -10px color-mix(in srgb,var(--c) 60%,transparent)}
  50%{box-shadow:0 0 52px -4px color-mix(in srgb,var(--c) 85%,transparent)}}

/* ---------- anello ---------- */
.ringwrap{position:relative;width:min(78vw,340px);aspect-ratio:1;margin:0 auto;flex:0 0 auto}
.ringwrap svg.arcs{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.slot{position:absolute;width:23%;aspect-ratio:1;left:50%;top:50%;transform:translate(-50%,-50%);
  display:grid;place-items:center;cursor:pointer;border:0;background:none;padding:0;
  transition:transform .18s cubic-bezier(.2,1.5,.4,1)}
.slot .in{width:100%;height:100%;display:grid;place-items:center;--cut:9px;--c:var(--faint);
  border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,rgba(12,10,30,.9)),rgba(9,7,24,.92));
  transition:border-color .16s,box-shadow .16s}
.slot.empty .in{border-style:dashed;border-width:2px;border-color:rgba(168,152,255,.62);
  background:radial-gradient(circle,rgba(120,104,220,.20),rgba(9,7,24,.85) 72%)}
.slot.empty svg.plus{stroke:rgba(190,178,255,.85);stroke-width:2;filter:none}
/* in collocazione ogni alloggiamento libero si accende: prima erano
   contorni tratteggiati quasi invisibili sul fondo scuro */
.slot.aperto .in{border-color:#fff;border-style:solid;
  background:radial-gradient(circle,rgba(150,134,255,.30),rgba(9,7,24,.85) 72%);
  animation:vuotoPulse 1.4s ease-in-out infinite}
.slot.aperto svg.plus{stroke:#fff}
@keyframes vuotoPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,255,255,.35),0 0 14px -4px rgba(190,178,255,.8)}
  50%{box-shadow:0 0 0 2px rgba(255,255,255,.75),0 0 30px -2px rgba(190,178,255,1)}}
.slot svg{width:52%;height:52%;stroke:var(--c);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;
  filter:drop-shadow(0 0 7px color-mix(in srgb,var(--c) 75%,transparent))}
.slot .lv{position:absolute;right:-2px;bottom:-4px;font:700 10px/1 var(--ui);color:#0a0818;background:var(--c);padding:2px 4px}
.slot.good .in{border-style:solid;border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,rgba(9,7,24,.9));
  animation:res 1.5s ease-in-out infinite}
.slot.good::after{content:"RISUONA";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font:600 8px/1 var(--ui);letter-spacing:.14em;color:var(--c);white-space:nowrap}
@keyframes res{0%,100%{box-shadow:0 0 0 1px color-mix(in srgb,var(--c) 55%,transparent),0 0 16px -4px var(--c)}
  50%{box-shadow:0 0 0 2px var(--c),0 0 34px -2px var(--c)}}
/* pronta a trasformarsi, o al massimo ma non ancora in posizione */
.slot.pronto .in{border-color:#fff;border-width:2px;animation:evoReady 1.1s ease-in-out infinite}
.slot.pronto::after{content:"TRASFORMABILE";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font:700 8px/1 var(--ui);letter-spacing:.12em;color:#fff;white-space:nowrap}
@keyframes evoReady{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.5),0 0 22px -4px var(--c)}
  50%{box-shadow:0 0 0 3px #fff,0 0 44px 0 var(--c)}}
.slot.vicino .in{border-style:dashed;border-width:2px}
.slot.vicino::after{content:"MAX";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font:700 8px/1 var(--ui);letter-spacing:.12em;color:var(--c);white-space:nowrap}
/* in dissoluzione le rune rimovibili si segnalano da sole */
.slot.dissolvibile .in{border-color:#ff3d6e;border-width:2px;animation:dissPulse 1s ease-in-out infinite}
.slot.dissolvibile svg{stroke:#ff8fae}
.slot.dissolvibile::after{content:"DISSOLVI";position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);
  font:700 8px/1 var(--ui);letter-spacing:.12em;color:#ff3d6e;white-space:nowrap}
@keyframes dissPulse{0%,100%{box-shadow:0 0 0 1px rgba(255,61,110,.5),0 0 16px -4px #ff3d6e}
  50%{box-shadow:0 0 0 2px #ff3d6e,0 0 32px -2px #ff3d6e}}
.card.diss .face{border-color:rgba(255,61,110,.5)}
.slot:hover{transform:translate(-50%,-50%) scale(1.09)}
.slot.sel{transform:translate(-50%,-50%) scale(1.13)}
.slot.sel .in{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 30px color-mix(in srgb,var(--c) 70%,transparent)}
.ringcore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:30%;aspect-ratio:1;
  display:grid;place-items:center;text-align:center;pointer-events:none}
.ringcore .n{font:800 30px/1 var(--disp);color:#fff;text-shadow:0 0 26px rgba(120,200,255,.7)}
.ringcore .l{font:600 8.5px/1 var(--ui);letter-spacing:.2em;color:var(--faint);margin-top:4px}

/* ---------- hub / potenziamenti ---------- */
.grid2{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.up{text-align:left;border:0;padding:0;background:none;font:inherit;cursor:pointer;--cut:9px;transition:transform .12s}
.up .face{display:flex;gap:11px;align-items:center;padding:11px 12px;height:100%;
  background:linear-gradient(160deg,rgba(26,21,60,.9),rgba(11,9,28,.9));border:1px solid var(--line)}
.up:hover{transform:translateY(-2px)}
.up:hover .face{border-color:var(--line-hot)}
.up.max .face{opacity:.55}
.up.poor{cursor:not-allowed}
.up.poor .face{opacity:.5}
.up .ico{flex:0 0 auto;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);--cut:6px}
.up .ico svg{width:19px;height:19px;stroke:var(--star);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
/* questi sono <span>: senza display:block restano in linea e si accavallano */
.up .face>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.up .nm{display:block;font:600 13px/1.2 var(--ui);color:#fff}
.up .ds{display:block;font:400 11px/1.35 var(--ui);color:var(--dim);margin-top:2px}
.up .cost{margin-left:auto;font:600 12px/1 var(--ui);color:var(--gold);white-space:nowrap;display:flex;align-items:center;gap:4px}
.up .cost.done{color:var(--xp)}

.chars{display:grid;gap:9px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}

/* apertura: sei caselle strette in fila, non sei carte. È una scelta
   piccola e va occupare poco, ma deve stare accanto al nucleo perché si
   leggano insieme */
.aprow{display:grid;gap:7px;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));margin-bottom:6px}
.ap{border:0;padding:0;background:none;font:inherit;cursor:pointer;--cut:7px;transition:transform .12s}
.ap .face{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 5px;
  background:linear-gradient(165deg,rgba(26,21,60,.9),rgba(11,9,28,.9));border:1px solid var(--line);height:100%}
.ap:hover{transform:translateY(-2px)}
.ap.on .face{border-color:var(--c);box-shadow:0 0 22px -8px var(--c);background:linear-gradient(165deg,color-mix(in srgb,var(--c) 20%,rgba(26,21,60,.9)),rgba(11,9,28,.92))}
.ap .ico{display:grid;place-items:center;width:30px;height:30px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.ap .ico svg{width:19px;height:19px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ap .nm{font:700 11.5px/1 var(--disp);color:#fff;letter-spacing:.02em}
.ap .ds{font:400 9.5px/1.2 var(--ui);color:var(--dim);text-align:center}
.ap.on .nm{color:var(--c)}

/* la nota dell'apertura scelta: dice cosa stai per giocare, invece di
   lasciartelo scoprire al terzo minuto */
.apnota{font:400 11.5px/1.5 var(--ui);color:var(--dim);text-align:left;margin:2px 0 2px;
  padding:8px 10px;border-left:2px solid var(--c);background:rgba(255,255,255,.028)}
.apnota b{color:var(--c);font-weight:700}

/* nucleo unico: un elenco con una voce sola non e' una scelta */
.unico{display:flex;align-items:center;gap:10px;padding:9px 11px;text-align:left;
  border:1px solid var(--line);background:rgba(255,255,255,.028);
  font:400 11.5px/1.45 var(--ui);color:var(--dim)}
.unico b{color:#fff;font:700 13px/1 var(--disp)}
.unico .av{flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff,var(--c,#bff6ff) 42%,rgba(0,0,0,.2) 100%);
  box-shadow:0 0 16px -2px var(--c,#bff6ff)}

/* la riga che separa "preparo la partita" da "spendo i frammenti" */
.hubsep{display:flex;align-items:center;gap:10px;margin:20px 0 10px;
  font:600 10px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:#6a6199}
.hubsep::before,.hubsep::after{content:"";flex:1;height:1px;background:var(--line)}
.seedbox{margin-top:10px}
.seedbox>summary{cursor:pointer;font:600 10px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;
  color:#6a6199;padding:7px 0;text-align:left;list-style:none}
.seedbox>summary::-webkit-details-marker{display:none}
.seedbox>summary::before{content:"+ ";color:var(--star)}
.seedbox[open]>summary::before{content:"− "}

/* riga di configurazione sotto a Gioca: dice cosa parte e si tocca per cambiarlo */
.cfg{border:0;background:none;font:inherit;cursor:pointer;--cut:8px;padding:0;width:100%}
.cfg .face{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px 10px;
  min-height:46px;padding:10px 12px;border:1px solid var(--line);background:rgba(255,255,255,.028)}
.cfg:hover .face{border-color:color-mix(in srgb,var(--star) 40%,transparent)}
.cfg .pt{font:600 11px/1 var(--ui);color:var(--c);display:inline-flex;align-items:center;gap:5px}
.cfg .pt::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
 /* la riga puo' andare a capo su schermi stretti: niente bordo, o quando
    "cambia" finisce da solo resta un trattino appeso in mezzo al vuoto */
.cfg .cam{font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;color:#8a80c0;margin-left:2px}
.cfg .cam::after{content:" \203A";font-size:13px;line-height:0}
.cfg:hover .cam{color:var(--star)}
.ch{border:0;padding:0;background:none;font:inherit;cursor:pointer;--cut:9px;text-align:center;transition:transform .12s}
/* Tutto il contenuto della carta sono <span>. Senza una colonna flex
   restavano in linea e si accavallavano: nome, descrizione e regola
   finivano uno sopra l'altro. */
.ch .face{display:flex;flex-direction:column;align-items:center;
  padding:14px 10px;background:linear-gradient(165deg,rgba(26,21,60,.9),rgba(11,9,28,.9));
  border:1px solid var(--line);height:100%}
.ch:hover{transform:translateY(-2px)}
.ch.on .face{border-color:var(--star);box-shadow:0 0 26px -8px rgba(191,246,255,.7)}
.ch .av{display:block;flex:0 0 auto;width:44px;height:44px;margin:0 0 8px;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fff,var(--c,#bff6ff) 42%,rgba(0,0,0,.2) 100%);
  box-shadow:0 0 24px -2px var(--c,#bff6ff)}
.ch .nm{display:block;font:700 15px/1 var(--disp);color:#fff}
.ch .ds{display:block;font:400 10.5px/1.4 var(--ui);color:var(--dim);margin-top:5px}
.ch .rule{display:block;width:100%;font:600 10.5px/1.45 var(--ui);color:var(--c);margin-top:8px;padding-top:8px;
  border-top:1px solid color-mix(in srgb,var(--c) 26%,transparent);text-wrap:balance}
.ch .lk{font:600 11px/1 var(--ui);color:var(--gold);margin-top:auto;padding-top:7px;
  display:flex;align-items:center;justify-content:center;gap:4px}

/* Un <svg> senza width/height si dimensiona da solo: qui diventava una
   stella nera da 143px in mezzo alla carta. E il tracciato non ha fill
   proprio, quindi senza currentColor resterebbe nero. */
.ch .lk svg,.up .cost svg,.reward svg,.sfida .sr svg{flex:0 0 auto;fill:currentColor;stroke:none}
.ch .lk svg{width:11px;height:11px}
.up .cost svg{width:12px;height:12px}
.ch.locked .face{opacity:.62}
.ch.locked.arm .face{opacity:1}
.ch .lk.avuto{color:var(--dim)}
.ch.on .lk.avuto{color:var(--star)}
.ch .sub{display:block;font:400 10px/1.35 var(--ui);color:var(--dim);margin-top:4px;text-wrap:balance}
.ch .sub.caro{color:#ff7d9c}
.ch .sub.arm{color:var(--gold)}
/* La spesa e' l'unica azione irreversibile della schermata: si arma e si
   conferma, e in entrambi i passi il bordo lo dichiara. */
.ch.arm .face,.up.arm .face{border-color:var(--gold);box-shadow:0 0 24px -6px rgba(255,200,87,.55)}
.up .ds .caro{color:#ff7d9c}
.up .ds.conf{color:var(--gold);font-weight:600}
.reward .delta{font:700 13px/1 var(--ui);color:#ff7d9c}
.reward.spesa{animation:spesaFx .45s ease-out}
@keyframes spesaFx{0%{transform:scale(1.16)}100%{transform:scale(1)}}

/* statistiche fine partita */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
@media(min-width:560px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--deep);padding:13px 11px;text-align:center}
.stat .v{font:800 22px/1 var(--disp);color:#fff}
.stat .k{font:600 9.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint);margin-top:6px}
.reward{display:flex;align-items:center;justify-content:center;gap:9px;font:700 21px/1 var(--disp);color:var(--gold)}
.reward svg{width:19px;height:19px}

/* toast */
/* I messaggi stavano al 22% dell'altezza, cioe' un palmo sopra il nucleo:
   proprio dentro il cono di schermo che stai guardando per schivare, e a
   coppie coprivano una striscia larga. Salgono sotto la barra dei guardiani
   e si stringono: si leggono lo stesso e non stanno piu' in mezzo. */
#toasts{position:absolute;left:50%;top:calc(100px + var(--sat));transform:translateX(-50%);z-index:15;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.94}
.toast{font:700 13.5px/1 var(--disp);letter-spacing:.03em;padding:7px 13px;--cut:6px;white-space:nowrap;
  background:rgba(8,6,22,.86);border:1px solid currentColor;backdrop-filter:blur(5px);
  animation:toastIn .35s cubic-bezier(.2,1.5,.4,1),toastOut .5s 1.6s forwards}
.toast small{display:block;font:500 9px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;opacity:.75;margin-top:4px}
@keyframes toastIn{from{transform:translateY(14px) scale(.9);opacity:0}}
@keyframes toastOut{to{transform:translateY(-16px);opacity:0}}

/* ---------- guida ---------- */
.frame.guide{max-width:620px;margin:0 auto}
.frame.guide>.inner{padding:20px 22px;display:flex;flex-direction:column;gap:20px}
.gsec .eyebrow{text-align:left;margin-bottom:8px}
.gsec p{font:400 13.5px/1.62 var(--ui);color:var(--dim);margin:0 0 8px}
.gsec p:last-child{margin-bottom:0}
.gsec p em{color:var(--txt);font-style:normal;font-weight:600}
.gsec p b{color:#fff;font-weight:600}
.gsec kbd{font:600 11px var(--ui);background:rgba(255,255,255,.08);border:1px solid var(--line);
  padding:2px 5px;color:var(--dim)}
/* i cinque Risvegli */
.awlist{display:flex;flex-direction:column;gap:5px;margin:12px 0}
.awrow{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;
  padding:8px 11px;--cut:6px;border-left:2px solid var(--c);background:rgba(255,255,255,.035);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.awrow .awn{font:700 13px/1.2 var(--disp);color:var(--c)}
.awrow .awe{font:600 8.5px/1 var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
.awrow .awd{grid-column:1 / -1;font:400 12px/1.45 var(--ui);color:var(--dim)}
@media(min-width:520px){.awrow .awd{grid-column:auto;text-align:right}}
/* tecniche */
ol.tips{margin:0;padding:0 0 0 20px;display:flex;flex-direction:column;gap:9px}
ol.tips li{font:400 13px/1.55 var(--ui);color:var(--dim)}
ol.tips li::marker{color:var(--xp);font-weight:700}
ol.tips b{color:#fff;font-weight:600}

/* semenza */
.seedrow{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;
  padding:11px 13px;--cut:8px;border:1px solid var(--line);background:rgba(11,9,28,.7);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.seedrow label{font:600 10px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.seedrow input{font:400 13px/1 ui-monospace,Consolas,monospace;color:var(--txt);
  background:rgba(5,3,16,.75);border:1px solid var(--line);padding:8px 10px;width:100%}
.seedrow input:focus{outline:none;border-color:var(--line-hot)}
.seedrow .sh{grid-column:1 / -1;font:400 11px/1.45 var(--ui);color:var(--faint)}
.seedout{text-align:center;font:600 10px/1 var(--ui);letter-spacing:.2em;color:var(--faint)}
.seedout b{font:700 13px/1 ui-monospace,Consolas,monospace;color:var(--dim);letter-spacing:0;margin-left:6px}

/* sfide */
/* ── prima volta ─────────────────────────────────────────────────
   La schermata che spiega una cosa mentre quella cosa sta succedendo
   dietro, ferma. Larga come una carta, non come un manuale. */
.brief{max-width:420px;margin:0 auto 14px;padding:16px 18px;text-align:left;--cut:12px;
  border:1px solid color-mix(in srgb,var(--c) 44%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,rgba(16,12,40,.95)),rgba(10,8,26,.96));
  box-shadow:0 0 46px -14px var(--c)}
/* Il distintivo sta DENTRO la carta. A cavallo del bordo superiore era piu'
   bello, ma la carta ha un clip-path e glielo tagliava di diciotto pixel
   (misurato): un'icona mozzata si legge come un difetto, non come stile. */
.brief .bi{width:44px;height:44px;margin:0 auto 10px;display:grid;place-items:center;--cut:9px;
  border:1px solid color-mix(in srgb,var(--c) 52%,transparent);background:rgba(7,6,19,.6)}
.brief .bi svg{width:24px;height:24px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.brief .eyebrow{text-align:center}
.brief .ttl{margin:6px 0 12px;text-align:center;color:var(--c)}
/* Due righe, non tre paragrafi: un pannello che ferma il gioco si legge
   solo se si legge in fretta. Testo più grande e meno testo. */
.brief p{margin:0 0 11px;font:400 13.5px/1.55 var(--ui);color:var(--dim)}
.brief p b{color:#fff;font-weight:600}
.brief p:last-of-type{margin-bottom:12px}
/* ── la scheggia, mostrata invece che descritta ───────────────────
   Un colore non si spiega a parole, e infatti «verdi» era pure sbagliato:
   la tinta è 159°, turchese, e «azzurre» avrebbe accavallato l'elemento
   Gelo. Qui la scheggia si vede, e si vede MENTRE viene raccolta — con la
   barra che sale nello stesso istante, che è il nesso che serve. Il nucleo
   è quello vero, con la sagoma e il colore scelti nell'Osservatorio. */
.dgem{margin:0 0 13px}
.dg-campo{position:relative;height:76px;overflow:hidden;--cut:8px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  border:1px solid var(--line);
  background:radial-gradient(70% 120% at 22% 50%,rgba(30,24,70,.75),rgba(8,6,22,.92))}
.dg-nucleo{position:absolute;left:24px;top:50%;width:36px;height:36px;margin-top:-18px;
  display:grid;place-items:center}
.dg-nucleo svg{width:36px;height:36px;fill:rgba(10,8,26,.85);stroke:var(--c);stroke-width:1.5;
  filter:drop-shadow(0 0 9px color-mix(in srgb,var(--c) 55%,transparent))}
.dg-nucleo svg circle:last-child{fill:#fff;stroke:none}
/* È il NUCLEO che va a prenderle. La versione precedente teneva il nucleo
   fermo e faceva volare le schegge dentro: si leggeva «arrivano da sole»,
   che è il contrario di quello che dice il testo sopra («passaci sopra») e
   di quello che si fa in partita. Il magnete esiste, ma tira solo l'ultimo
   pezzo: la distanza la copri tu.
   Quindi le schegge stanno ferme dove sono cadute, il nucleo attraversa il
   campo e se le prende una alla volta — e solo quando è vicino scatta il
   risucchio, che è esattamente il raggio di raccolta del gioco vero. */
.dg-campo{position:relative;height:76px;overflow:hidden;--cut:8px;
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px);
  border:1px solid var(--line);
  background:radial-gradient(70% 120% at 22% 50%,rgba(30,24,70,.75),rgba(8,6,22,.92))}
.dg-nucleo{position:absolute;left:24px;top:50%;width:36px;height:36px;margin-top:-18px;
  display:grid;place-items:center;animation:dgCorsa 3s cubic-bezier(.5,.02,.5,.98) infinite}
.dg-nucleo svg{width:36px;height:36px;fill:rgba(10,8,26,.85);stroke:var(--c);stroke-width:1.5;
  filter:drop-shadow(0 0 9px color-mix(in srgb,var(--c) 55%,transparent))}
.dg-nucleo svg circle:last-child{fill:#fff;stroke:none}
/* la scia sta DIETRO al nucleo, cioè a sinistra: è lui che si muove */
.dg-nucleo::after{content:"";position:absolute;right:100%;top:50%;height:3px;width:30px;margin-top:-1.5px;
  background:linear-gradient(270deg,color-mix(in srgb,var(--c) 65%,transparent),transparent)}
@keyframes dgCorsa{
  0%   {transform:translateX(0);opacity:0}
  5%   {transform:translateX(12px);opacity:1}
  84%  {transform:translateX(250px);opacity:1}
  90%  {transform:translateX(258px);opacity:0}
  93%  {transform:translateX(0);opacity:0}
  100% {transform:translateX(0);opacity:0}
}
/* le schegge non si muovono: aspettano dove sono cadute */
.dg-s{position:absolute;top:50%;left:6px;width:9px;height:9px;margin-top:-4.5px;border-radius:50%;
  background:var(--xp);box-shadow:0 0 13px 2px rgba(111,242,196,.85)}
/* l'anello che il nucleo emette quando l'ha inghiottita */
.dg-s::before{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;border:1.5px solid var(--xp);opacity:0}
/* una serie per scheggia: sparisce quando il nucleo la raggiunge, e
   tornano tutte insieme quando il giro ricomincia */
.dg-s.u{animation:dgPresa1 3s linear infinite}
.dg-s.d{animation:dgPresa2 3s linear infinite}
.dg-s.t{animation:dgPresa3 3s linear infinite}
.dg-s.u::before{animation:dgOnda1 3s linear infinite}
.dg-s.d::before{animation:dgOnda2 3s linear infinite}
.dg-s.t::before{animation:dgOnda3 3s linear infinite}
@keyframes dgPresa1{
  0%,23%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
  27%   {transform:translate(calc(var(--x0) - 13px),var(--y0)) scale(1.25);opacity:1}
  31%,91%{transform:translate(calc(var(--x0) - 26px),var(--y0)) scale(.1);opacity:0}
  /* torna a casa da invisibile: scivolare indietro a vista, anche per
     trenta millisecondi, e' un movimento nel verso sbagliato */
  92%,93%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
  94%,100%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
}
@keyframes dgPresa2{
  0%,47%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
  51%   {transform:translate(calc(var(--x0) - 13px),var(--y0)) scale(1.25);opacity:1}
  55%,91%{transform:translate(calc(var(--x0) - 26px),var(--y0)) scale(.1);opacity:0}
  /* torna a casa da invisibile: scivolare indietro a vista, anche per
     trenta millisecondi, e' un movimento nel verso sbagliato */
  92%,93%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
  94%,100%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
}
@keyframes dgPresa3{
  0%,71%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
  75%   {transform:translate(calc(var(--x0) - 13px),var(--y0)) scale(1.25);opacity:1}
  79%,91%{transform:translate(calc(var(--x0) - 26px),var(--y0)) scale(.1);opacity:0}
  /* torna a casa da invisibile: scivolare indietro a vista, anche per
     trenta millisecondi, e' un movimento nel verso sbagliato */
  92%,93%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:0}
  94%,100%{transform:translate(var(--x0),var(--y0)) scale(1);opacity:1}
}
@keyframes dgOnda1{0%,26%{transform:scale(1);opacity:0} 29%{opacity:.9} 40%,100%{transform:scale(5);opacity:0}}
@keyframes dgOnda2{0%,50%{transform:scale(1);opacity:0} 53%{opacity:.9} 64%,100%{transform:scale(5);opacity:0}}
@keyframes dgOnda3{0%,74%{transform:scale(1);opacity:0} 77%{opacity:.9} 88%,100%{transform:scale(5);opacity:0}}
.dg-barra{height:6px;margin-top:7px;background:rgba(111,242,196,.13);overflow:hidden;
  border:1px solid rgba(111,242,196,.22)}
/* la barra scatta a ogni raccolta, e al giro dopo riparte da capo: è
   quello che succede davvero quando sali di livello */
.dg-barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d8a4,var(--xp));
  box-shadow:0 0 10px rgba(111,242,196,.7);animation:dgBarra 3s steps(1,end) infinite}
@keyframes dgBarra{
  0%,26%{width:16%} 27%,50%{width:46%} 51%,74%{width:74%} 75%,100%{width:100%}
}
.dg-eti{margin-top:5px;font:600 8.5px/1 var(--ui);letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);text-align:center}
/* chi ha chiesto meno movimento vede la stessa scena, ferma */
@media (prefers-reduced-motion:reduce){
  .dg-nucleo,.dg-nucleo::after,.dg-s,.dg-s::before{animation:none}
  .dg-nucleo{transform:translateX(96px);opacity:1}
  .dg-s{opacity:1;transform:translate(var(--x0),var(--y0))}
  .dg-barra i{animation:none;width:46%}
}

.brief .bnota{padding-top:10px;border-top:1px solid var(--line);
  font:600 9.5px/1.5 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint);text-align:center}

/* ══ Osservatorio a schede ════════════════════════════════════════
   Era una colonna sola alta 5259 pixel su un telefono — sette schermate,
   diciassette sezioni, sessantuno bottoni — e faceva cinque lavori
   diversi: preparare la corsa, spendere, seguire gli obiettivi, guardare
   lo storico, gestire il salvataggio. Il bottone Inizia stava a
   millecento pixel dall'alto, cioè dopo una schermata e mezza.
   Adesso sono quattro schede, e le due cose che servono sempre —
   quanti frammenti hai, e far partire la corsa — restano incollate in
   cima e in fondo mentre il resto scorre.                              */
.screen[data-s^="hub"].on{justify-content:flex-start;gap:12px;padding-bottom:0}

.hubtop{position:sticky;top:calc(-20px - var(--sat));z-index:4;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  margin:calc(-20px - var(--sat)) 0 0;padding:calc(14px + var(--sat)) 2px 10px;
  background:var(--void)}
.hubtop .ttl{margin:0;text-align:left;font-size:clamp(20px,5.5vw,26px)}
.hubtop .reward{font-size:17px}

.tabs{position:sticky;top:calc(30px + var(--sat));z-index:3;display:grid;
  grid-template-columns:repeat(4,1fr);gap:5px;padding:0 0 10px;background:var(--void)}
.tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:20px;
  background:linear-gradient(180deg,var(--void),rgba(6,4,18,0));pointer-events:none}
.tab{border:0;padding:0;background:none;font:inherit;cursor:pointer;--cut:7px;
  min-height:46px;transition:transform .12s}
.tab .face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  height:100%;padding:7px 3px;border:1px solid var(--line);
  background:linear-gradient(165deg,rgba(26,21,60,.55),rgba(11,9,28,.88)),var(--deep);
  font:700 10.5px/1.1 var(--ui);letter-spacing:.04em;color:var(--dim);white-space:nowrap}
.tab:hover .face{border-color:var(--line-hot);color:#fff}
.tab.on .face{border-color:var(--star);color:#fff;
  background:linear-gradient(165deg,rgba(191,246,255,.18),rgba(11,9,28,.92)),var(--deep);
  box-shadow:0 0 20px -8px rgba(191,246,255,.8)}
/* la pallina dice "qui c'è qualcosa che puoi permetterti / che manca" */
.tab .pin{position:absolute;margin:-16px 0 0 44px;width:6px;height:6px;background:var(--gold);
  border-radius:50%;box-shadow:0 0 8px var(--gold)}

/* La barra che fa partire la corsa. Incollata in fondo, sopra all'area
   sicura del telefono: dovunque tu sia arrivato a scorrere, «Inizia» è
   sotto il pollice invece che a millecento pixel di distanza. */
/* La barra è OPACA, con una sfumatura corta appoggiata sopra: il gradiente
   unico faceva traspirare il contenuto che le scorreva sotto — l'ascensione
   si leggeva attraverso «Inizia», che è il modo in cui si vede un difetto. */
.hubaz{position:sticky;bottom:0;z-index:3;margin-top:auto;
  padding:10px 0 calc(12px + var(--sab));background:var(--void)}
.hubaz::before{content:"";position:absolute;left:0;right:0;bottom:100%;height:22px;
  background:linear-gradient(0deg,var(--void),rgba(6,4,18,0));pointer-events:none}
.hubaz .riep{display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap;
  font:600 10px/1 var(--ui);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);
  margin:0 0 8px}
.hubaz .riep b{color:var(--c,#ece8ff);font-weight:700}
.hubaz .btnrow{gap:8px}

/* ══ la carta della corsa ═════════════════════════════════════════
   Formato, nucleo, apertura, ascensione e congiunzione erano cinque
   oggetti separati sparsi per la schermata del titolo. Sono una cosa
   sola — «che partita sto per giocare» — quindi sono un blocco solo. */
/* Dietro al menu gira il gioco vero, quindi ogni pannello che porta testo
   deve avere una base OPACA sotto la tinta: misurato, questa carta era al
   72% in cima e la cella del formato scelto al 17%, cioè il nucleo e le
   gemme passavano attraverso le scritte. La tinta resta, ma sopra a
   var(--deep) invece che sopra alla partita. */
.runcard{display:flex;flex-direction:column;gap:0;--cut:11px;
  border:1px solid var(--line);
  background:linear-gradient(168deg,rgba(30,24,70,.9),rgba(14,11,36,.96)),var(--deep)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.segb{border:0;padding:0;background:var(--deep);font:inherit;cursor:pointer;min-height:52px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:background .14s,color .14s}
.segb b{font:700 13.5px/1 var(--disp);color:var(--dim)}
.segb em{font:500 9.5px/1 var(--ui);font-style:normal;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.segb:hover{background:#151030}
.segb.on{background:linear-gradient(165deg,rgba(111,242,196,.19),rgba(11,9,28,.9)),var(--deep)}
.segb.on b{color:var(--xp)}
.segb.on em{color:rgba(111,242,196,.75)}

.runrow{width:100%;border:0;border-top:1px solid var(--line);background:none;cursor:pointer;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:11px 12px;min-height:48px;
  font:inherit;text-align:left}
.runrow:hover{background:rgba(158,138,255,.06)}
.runrow .pt{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--ui);color:var(--c)}
.runrow .pt::before{content:"";width:6px;height:6px;background:var(--c);border-radius:50%;flex:0 0 auto}
.runrow .cam{margin-left:auto;font:600 9.5px/1 var(--ui);letter-spacing:.16em;
  text-transform:uppercase;color:var(--faint);white-space:nowrap}
.runrow .cam::after{content:" ›";font-size:13px}
.runcard .cong{border:0;border-top:1px solid var(--line);--cut:0;clip-path:none;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 13%,rgba(14,11,36,.94)),rgba(10,8,26,.96)),var(--deep)}

/* il bottone che fa partire tutto: più alto degli altri, perché è quello */
.btn.grande .face{min-height:60px;font-size:16px;letter-spacing:.24em}

/* ══ titolo: l'azione sta dove arriva il pollice ══════════════════ */
@media (max-width:560px){
  .hero{min-height:100%;padding-top:clamp(6px,2.5vh,26px);gap:12px}
  .hero .cta{margin-top:auto}
  .hero .hint{margin-bottom:2px}
}

/* ── formato della partita ───────────────────────────────────────
   Due bersagli da pollice, non una tendina: è la scelta che decide se la
   prima sessione conterrà una conclusione, quindi si vede senza cercarla. */
.modorow{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:8px;margin:0 0 9px}
.modo{border:0;padding:0;background:none;font:inherit;cursor:pointer;--cut:8px;transition:transform .12s}
.modo .face{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 8px;height:100%;
  border:1px solid var(--line);background:linear-gradient(165deg,rgba(26,21,60,.62),rgba(11,9,28,.9))}
.modo:hover{transform:translateY(-2px)}
.modo:hover .face{border-color:var(--line-hot)}
.modo.on .face{border-color:var(--xp);box-shadow:0 0 22px -8px var(--xp);
  background:linear-gradient(165deg,color-mix(in srgb,var(--xp) 17%,rgba(26,21,60,.9)),rgba(11,9,28,.92))}
.modo .mn{font:700 14px/1 var(--disp);color:#fff}
.modo.on .mn{color:var(--xp)}
.modo .md{font:400 10px/1.25 var(--ui);color:var(--dim);text-align:center}

/* ── congiunzione ────────────────────────────────────────────────
   La regola sorteggiata per la prossima corsa, scritta sotto al bottone
   che la fa partire: una regola che leggi prima è una scelta, una che
   scopri al terzo minuto è una sorpresa. */
.cong{display:flex;align-items:center;gap:9px;padding:9px 11px;text-align:left;--cut:8px;
  border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 13%,rgba(15,12,36,.9)),rgba(11,9,28,.92)),var(--deep)}
.cong.calma{border-color:var(--line);background:linear-gradient(150deg,rgba(20,16,46,.7),rgba(11,9,28,.9)),var(--deep)}
.cong .ci{flex:0 0 auto;width:30px;height:30px;display:grid;place-items:center;--cut:6px;
  border:1px solid color-mix(in srgb,var(--c) 42%,transparent)}
.cong .ci svg{width:17px;height:17px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.cong .ct{display:flex;flex-direction:column;gap:2px;min-width:0;font:400 11px/1.4 var(--ui);color:var(--dim)}
.cong .ct b{font:700 12.5px/1 var(--disp);color:var(--c);letter-spacing:.02em}
.cong .ck{font:600 8.5px/1 var(--ui);letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}

/* corsa del giorno: un bottone nella riga secondaria, non una sezione */
/* tre bottoni nella stessa riga: .btnrow è già flex con .btn{flex:1}, qui
   serve solo stringere il testo perché ci stia su un telefono stretto */
.btnrow.tre{gap:6px}
.btnrow.tre .btn .face{padding-left:4px;padding-right:4px;font-size:10px;letter-spacing:.02em;white-space:nowrap}
.btn.giorno .face{gap:6px}
.btn.giorno svg{width:15px;height:15px;fill:none;stroke:var(--gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ── rune nel mazzo ──────────────────────────────────────────────
   Sedici caselle: quelle accese sono tue, quelle spente sono il motivo
   della prossima partita. */
.runerow{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0}
.rn{width:30px;height:30px;display:grid;place-items:center;--cut:6px;
  border:1px solid var(--line);background:rgba(11,9,28,.6);opacity:.32}
.rn svg{width:17px;height:17px;fill:none;stroke:var(--faint);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.rn.on{opacity:1;border-color:color-mix(in srgb,var(--c) 46%,transparent);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 15%,rgba(15,12,36,.9)),rgba(11,9,28,.92))}
.rn.on svg{stroke:var(--c)}

/* ── storico ─────────────────────────────────────────────────────
   Le ultime venti partite: in un gioco senza rete è l'unica telemetria. */
.storico{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line)}
.storico .sr{display:grid;grid-template-columns:52px 1fr 1fr 74px 62px;gap:8px;align-items:center;
  padding:7px 9px;background:var(--deep);font:400 10.5px/1.2 var(--ui);color:var(--dim)}
.storico .sr.vinta{background:linear-gradient(90deg,rgba(20,44,44,.7),var(--deep))}
.storico .st{font:700 12px/1 var(--disp);color:#fff}
.storico .sw{text-align:right;color:var(--faint)}
.storico .sr.vinta .sw{color:var(--xp);font-weight:600}
.storico .sc,.storico .sk{color:var(--faint)}
@media (max-width:520px){
  .storico .sr{grid-template-columns:50px 1fr 60px;row-gap:2px}
  .storico .sc,.storico .sk{display:none}
}

/* ── il gancio della schermata finale ────────────────────────────
   Cosa c'è dopo: la prossima runa, la cosa più vicina da comprare, il
   contratto più a portata. È il momento in cui si decide se ci sarà
   un'altra partita, quindi non può essere solo un consuntivo. */
.dopo{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));margin:2px 0 4px}
.dv{display:flex;align-items:center;gap:9px;padding:8px 10px;text-align:left;--cut:7px;
  border:1px solid color-mix(in srgb,var(--c) 32%,transparent);background:rgba(13,10,32,.8)}
.dv .di{flex:0 0 auto;width:28px;height:28px;display:grid;place-items:center;--cut:6px;
  border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.dv .di svg{width:16px;height:16px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dv .dt{display:flex;flex-direction:column;gap:2px;min-width:0;font:400 10.5px/1.4 var(--ui);color:var(--faint)}
.dv .dt b{font:700 12px/1 var(--disp);color:var(--c)}

/* una runa nuova nel mazzo è la cosa migliore che la schermata finale
   possa dire: non sta in un elenco, sta da sola */
.runanuova{display:flex;align-items:center;gap:11px;padding:11px 13px;margin:2px auto;max-width:420px;text-align:left;--cut:9px;
  border:1px solid color-mix(in srgb,var(--c) 52%,transparent);
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 18%,rgba(15,12,36,.92)),rgba(11,9,28,.94));
  box-shadow:0 0 30px -10px var(--c)}
.runanuova .ri{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;--cut:7px;
  border:1px solid color-mix(in srgb,var(--c) 46%,transparent)}
.runanuova .ri svg{width:23px;height:23px;fill:none;stroke:var(--c);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.runanuova .rt{display:flex;flex-direction:column;gap:2px;min-width:0;font:400 11px/1.4 var(--ui);color:var(--dim)}
.runanuova .rk{font:600 9px/1 var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--faint)}
.runanuova .rt b{font:700 15px/1 var(--disp);color:var(--c)}
.sfidelist{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.sfida{--cut:7px;padding:9px 11px;display:flex;flex-direction:column;gap:3px;
  background:linear-gradient(160deg,rgba(22,18,52,.8),rgba(10,8,26,.85));border:1px solid var(--line)}
.sfida.fatta{border-color:rgba(111,242,196,.44);background:linear-gradient(160deg,rgba(20,44,44,.6),rgba(10,8,26,.85))}
.sfida .sn{font:700 12.5px/1.2 var(--disp);color:var(--dim)}
.sfida.fatta .sn{color:var(--xp)}
.sfida .sd{font:400 11px/1.4 var(--ui);color:var(--faint)}
.sfida .sr{display:flex;align-items:center;gap:4px;font:600 10px/1 var(--ui);color:var(--gold);margin-top:2px}
.sfida .sr svg{width:10px;height:10px}

/* ascensioni */
.ascrow{display:flex;flex-wrap:wrap;gap:7px}
.asc{width:44px;height:44px;--cut:7px;cursor:pointer;font:700 14px/1 var(--disp);
  clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut));
  color:var(--dim);background:linear-gradient(160deg,rgba(26,21,60,.9),rgba(11,9,28,.9));
  border:1px solid var(--line);transition:color .15s,border-color .15s,transform .12s}
.asc:hover:not(:disabled){transform:translateY(-2px);color:#fff;border-color:var(--line-hot)}
.asc.on{color:#0a0818;background:var(--gold);border-color:var(--gold);
  box-shadow:0 0 22px -6px var(--gold)}
.asc.lock{opacity:.3;cursor:not-allowed}
.ascrules{margin:10px 0 0;padding:0 0 0 17px;font:400 12.5px/1.7 var(--ui);color:var(--dim)}
.ascrules li{margin:0}
.ascrules li::marker{color:var(--gold)}
#ascchip{position:absolute;left:12px;top:calc(74px + var(--sat));display:none;align-items:center;gap:5px;
  font:700 10px/1 var(--ui);letter-spacing:.16em;padding:4px 8px;--cut:5px;
  color:var(--gold);background:rgba(12,10,30,.78);border:1px solid rgba(255,200,87,.4);backdrop-filter:blur(4px)}
#ascchip.on{display:flex}
/* in basso al centro: in alto finiva sopra la barra del guardiano */
#nodochip{position:absolute;left:50%;bottom:calc(52px + var(--sab));transform:translateX(-50%);
  display:none;align-items:center;gap:6px;font:700 10px/1 var(--ui);letter-spacing:.16em;
  padding:5px 10px;--cut:5px;color:var(--c,#fff);background:rgba(12,10,30,.82);
  border:1px solid currentColor;backdrop-filter:blur(4px);animation:pop .3s cubic-bezier(.2,1.6,.4,1)}
#nodochip.on{display:flex}
#nodochip i{width:6px;height:6px;background:currentColor;display:block;transform:rotate(45deg)}

/* avviso e backup dei progressi */
.warn{font:500 11.5px/1.55 var(--ui);color:#ffc857;text-align:center;max-width:52ch;margin:0 auto;
  padding:9px 13px;background:rgba(255,200,87,.09);border:1px solid rgba(255,200,87,.34);--cut:7px}
.backup{border:1px solid var(--line);--cut:9px;padding:12px 14px;background:rgba(11,9,28,.7)}
.backup summary{font:600 10px/1 var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
  cursor:pointer;list-style:none}
.backup summary::-webkit-details-marker{display:none}
.backup summary::before{content:"▸ ";color:var(--faint)}
.backup[open] summary::before{content:"▾ "}
.backup[open] summary{margin-bottom:11px}
.backup textarea,.backup input{width:100%;font:400 11px/1.5 ui-monospace,Consolas,monospace;
  color:var(--txt);background:rgba(5,3,16,.75);border:1px solid var(--line);padding:8px 10px;
  resize:vertical;word-break:break-all}
.backup input{margin-top:10px;font-size:12px}
.backup textarea:focus,.backup input:focus{outline:none;border-color:var(--line-hot)}
/* zona rossa: separata da una riga, cosi' non si tocca per sbaglio uscendo
   dal campo del codice, e rossa solo lei */
.backup .danger{margin-top:15px;padding-top:13px;border-top:1px solid var(--line)}
.backup .danger .dt{display:block;font:600 10px/1 var(--ui);letter-spacing:.22em;
  text-transform:uppercase;color:#ff3d6e;margin-bottom:8px}
.hint.dwarn{color:var(--dim)}
.hint.dwarn b{color:#ff8aa8;font-weight:600}
.btn.bad .face{border-color:rgba(255,61,110,.4);color:#ff8aa8}
.btn.bad:hover .face,.btn.bad:focus-visible .face{border-color:#ff3d6e;color:#fff;
  background:linear-gradient(165deg,rgba(255,61,110,.3),rgba(90,14,40,.5))}

.hint{font:400 11.5px/1.5 var(--ui);color:var(--faint);text-align:center}
.hint kbd{font:600 11px var(--ui);background:rgba(255,255,255,.08);border:1px solid var(--line);padding:2px 5px;color:var(--dim)}
.legend{display:flex;flex-wrap:wrap;gap:7px;justify-content:center}
.el{display:inline-flex;align-items:center;gap:5px;font:600 10px/1 var(--ui);letter-spacing:.14em;text-transform:uppercase;
  padding:5px 8px;--cut:5px;border:1px solid color-mix(in srgb,var(--c) 45%,transparent);color:var(--c);
  background:color-mix(in srgb,var(--c) 10%,transparent)}
.el b{width:6px;height:6px;background:currentColor;display:block}

@media(max-width:520px){
  .screen{gap:14px}
  .screen.on{justify-content:flex-start}
  .card .face{min-height:0}
  #clock{font-size:21px}
}
@media(prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
